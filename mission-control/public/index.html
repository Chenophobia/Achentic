<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission control</title>
<style>
  :root {
    --floor: #e9edf0;
    --panel: #ffffff;
    --ink: #15202b;
    --muted: #5b6875;
    --line: #cbd3da;
    --run: #d99000;
    --pass: #1e8a4f;
    --stop: #c2382e;
    --wait: #7c8894;
    --link: #1d4e89;
    --head: "Avenir Next Condensed", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --code: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--floor); color: var(--ink); font: 15px/1.45 var(--body); }
  body { margin: 0; }
  h1, h2, h3 { font-family: var(--head); font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  h1 { font-size: 1.7rem; }
  h2 { font-size: 1.25rem; }
  h3 { font-size: 1.05rem; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .row:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
  .id { font-family: var(--code); font-size: 0.86rem; }
  .muted { color: var(--muted); }

  header.top { display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap; padding: 1rem 1.4rem 0.8rem; border-bottom: 2px solid var(--ink); background: var(--panel); }
  header.top .spend { margin-left: auto; color: var(--muted); }
  header.top .spend strong { color: var(--ink); }

  .shell { display: grid; grid-template-columns: 15rem 1fr; gap: 1.4rem; padding: 1.2rem 1.4rem 3rem; max-width: 96rem; margin: 0 auto; }
  nav.projects { display: flex; flex-direction: column; gap: 0.35rem; align-self: start; position: sticky; top: 1rem; }
  nav.projects button { text-align: left; background: none; border: 0; border-left: 4px solid transparent; padding: 0.45rem 0.7rem; color: var(--ink); }
  nav.projects button[aria-current="true"] { border-left-color: var(--ink); background: var(--panel); font-weight: 600; }
  nav.projects .tally { display: block; font-size: 0.82rem; color: var(--muted); font-weight: 400; }
  nav.projects .new { margin-top: 0.8rem; border: 2px solid var(--ink); background: var(--ink); color: #fff; padding: 0.55rem 0.7rem; font-weight: 600; text-align: center; }

  section { margin-bottom: 1.6rem; }
  .now { background: var(--panel); border: 2px solid var(--run); padding: 0.9rem 1.1rem; margin-top: 0.6rem; }
  .now .step { font-family: var(--head); font-size: 1.35rem; font-weight: 600; }
  .now .pulse { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--run); margin-right: 0.5rem; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .now .pulse { animation: none; } }
  .idle { color: var(--muted); padding: 0.6rem 0; }

  .rows { background: var(--panel); border: 1px solid var(--line); margin-top: 0.6rem; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 15rem 6.5rem; gap: 1rem; align-items: center; padding: 0.7rem 1rem; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #f4f6f8; }
  .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { text-align: right; font-size: 0.86rem; color: var(--muted); }

  .track { display: flex; align-items: center; }
  .track i { width: 0.72rem; height: 0.72rem; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); flex: none; }
  .track b { height: 2px; background: var(--line); flex: 1; min-width: 0.5rem; }
  .track i.done, .track b.done { background: var(--ink); border-color: var(--ink); }
  .track.building i.here { background: var(--run); border-color: var(--run); box-shadow: 0 0 0 3px rgba(217, 144, 0, 0.25); }
  .track.blocked i.here { background: var(--stop); border-color: var(--stop); }
  .track.merged i.done, .track.merged b.done, .track.review i.done, .track.review b.done { background: var(--pass); border-color: var(--pass); }
  .word { font-size: 0.86rem; margin-top: 0.2rem; }
  .word.building { color: #8a5c00; } .word.blocked { color: var(--stop); } .word.merged, .word.review { color: var(--pass); } .word.queued, .word.waiting, .word.done { color: var(--muted); }

  aside.sheet { position: fixed; inset: 0 0 0 auto; width: min(46rem, 100%); background: var(--panel); border-left: 2px solid var(--ink); overflow-y: auto; padding: 1.2rem 1.5rem 3rem; transform: translateX(100%); transition: transform 0.18s ease-out; }
  aside.sheet.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { aside.sheet { transition: none; } }
  .sheet .close { float: right; border: 1px solid var(--line); background: none; padding: 0.3rem 0.7rem; }
  .sheet .stations { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); margin: 0.25rem 0 1.2rem; }
  .sheet h3 { margin: 1.5rem 0 0.5rem; padding-top: 0.9rem; border-top: 1px solid var(--line); }
  .why { border: 2px solid var(--stop); padding: 0.7rem 0.9rem; margin: 0.8rem 0; }
  .why button { margin-top: 0.6rem; border: 2px solid var(--ink); background: var(--ink); color: #fff; padding: 0.35rem 0.8rem; }
  ol.timeline { list-style: none; margin: 0; padding: 0; }
  ol.timeline li { display: grid; grid-template-columns: 5.2rem 1fr; gap: 0.8rem; padding: 0.22rem 0; }
  ol.timeline time { font-family: var(--code); font-size: 0.8rem; color: var(--muted); padding-top: 0.1rem; }
  .agent { border: 1px solid var(--line); padding: 0.8rem 0.95rem; margin-bottom: 0.7rem; }
  .agent .who { display: flex; gap: 0.8rem; align-items: baseline; flex-wrap: wrap; }
  .agent .who strong { font-family: var(--head); font-size: 1.1rem; }
  .agent dl { display: grid; grid-template-columns: 7rem 1fr; gap: 0.25rem 0.8rem; margin: 0.6rem 0 0; }
  .agent dt { color: var(--muted); }
  .agent dd { margin: 0; }
  .key { display: inline-block; min-width: 3.6rem; margin-right: 0.6rem; font-weight: 600; }
  .small { font-size: 0.84rem; }
  section.phase { margin: 0; padding: 0.9rem 0 0.9rem 1.1rem; border-left: 3px solid var(--line); }
  section.phase.done { border-left-color: var(--ink); }
  section.phase.now { border-left-color: var(--run); }
  section.phase.stopped { border-left-color: var(--stop); }
  section.phase h3 { margin: 0 0 0.4rem; padding: 0; border: 0; display: flex; align-items: baseline; gap: 0.6rem; }
  section.phase h3 .n { font-family: var(--code); font-size: 0.8rem; color: var(--muted); }
  section.phase h3 .state { font-family: var(--body); font-weight: 400; font-size: 0.84rem; color: var(--muted); }
  section.phase.now h3 .state { color: #8a5c00; } section.phase.stopped h3 .state { color: var(--stop); }
  section.phase.later { opacity: 0.6; }
  .used { margin: 0 0 0.5rem; font-size: 0.86rem; color: var(--muted); }
  .sheet h3.plain { margin-top: 1.6rem; }
  .chip { display: inline-block; border: 1px solid var(--ink); padding: 0 0.45rem; margin: 0 0.3rem 0.25rem 0; font-size: 0.84rem; }
  .helpers { margin: 0.5rem 0 0; padding-left: 1.1rem; }
  .helpers li { margin-bottom: 0.3rem; }
  details { margin-top: 0.55rem; }
  details summary { cursor: pointer; color: var(--link); }
  pre { font-family: var(--code); font-size: 0.8rem; white-space: pre-wrap; overflow-wrap: anywhere; background: #f4f6f8; padding: 0.7rem; margin: 0.4rem 0 0; max-height: 28rem; overflow-y: auto; }

  dialog { border: 2px solid var(--ink); padding: 1.3rem 1.5rem; width: min(38rem, 94vw); }
  dialog::backdrop { background: rgba(21, 32, 43, 0.45); }
  dialog label { display: block; margin-top: 0.8rem; font-weight: 600; }
  dialog label span { display: block; font-weight: 400; color: var(--muted); font-size: 0.86rem; }
  dialog input, dialog textarea, dialog select { width: 100%; font: inherit; padding: 0.45rem 0.55rem; border: 1px solid var(--muted); margin-top: 0.25rem; }
  dialog textarea { min-height: 4.2rem; resize: vertical; }
  dialog .actions { display: flex; gap: 0.7rem; justify-content: flex-end; margin-top: 1.1rem; }
  dialog .actions button { padding: 0.45rem 1rem; border: 2px solid var(--ink); background: none; }
  dialog .actions button.go { background: var(--ink); color: #fff; }
  .error { color: var(--stop); margin-top: 0.6rem; min-height: 1.3rem; }

  @media (max-width: 60rem) {
    .shell { grid-template-columns: 1fr; }
    nav.projects { position: static; flex-direction: row; flex-wrap: wrap; }
    nav.projects button { border-left: 0; border-bottom: 4px solid transparent; }
    nav.projects button[aria-current="true"] { border-bottom-color: var(--ink); }
    nav.projects .new { margin-top: 0; }
    .row { grid-template-columns: 1fr; gap: 0.35rem; }
    .row .meta { text-align: left; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Mission control</h1>
  <span class="muted" id="clock"></span>
  <span class="spend" id="spend"></span>
</header>
<div class="shell">
  <nav class="projects" id="projects" aria-label="Projects"></nav>
  <main>
    <section aria-live="polite">
      <h2>Working now</h2>
      <div id="now"></div>
    </section>
    <section>
      <h2 id="list-title">Tickets</h2>
      <div class="rows" id="rows"></div>
    </section>
  </main>
</div>
<aside class="sheet" id="sheet" aria-label="Ticket"></aside>

<dialog id="new">
  <form method="dialog" id="new-form">
    <h2>New ticket</h2>
    <label>Project<select name="app" id="new-app"></select></label>
    <label>Title<input name="title" required maxlength="120"></label>
    <label>Goal<span>One sentence. What can a user do after this, or what must never happen again?</span><textarea name="goal" required></textarea></label>
    <label>Done-check<span>What you could see on the running app that passes or fails.</span><textarea name="doneCheck" required></textarea></label>
    <label>Proof wanted<span>Optional. What evidence you want.</span><textarea name="proof"></textarea></label>
    <label>Known<span>Optional. Facts and earlier decisions. No file paths, no theory of the cause.</span><textarea name="known"></textarea></label>
    <p class="error" id="new-error" role="alert"></p>
    <div class="actions">
      <button type="button" id="new-cancel">Cancel</button>
      <button type="submit" class="go">Queue ticket</button>
    </div>
  </form>
</dialog>

<dialog id="login">
  <form method="dialog" id="login-form">
    <h2>Sign in</h2>
    <label>Access word<input name="token" type="password" required autocomplete="current-password"></label>
    <p class="error" id="login-error" role="alert"></p>
    <div class="actions"><button type="submit" class="go">Sign in</button></div>
  </form>
</dialog>

<script>
const PHASES = ["Plan", "Design", "Build", "Test", "Deploy", "Maintain"];
const WORDS = { waiting: "Waiting for the orchestrator", queued: "Queued", building: "In progress", review: "Ready to merge", merged: "Merged", blocked: "Blocked", done: "Done earlier" };
const view = { apps: [], app: null, tickets: [], open: null };

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== undefined && value !== false) node.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) if (child !== undefined && child !== null && child !== false) node.append(child);
  return node;
}

async function call(path, body) {
  const response = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : undefined);
  if (response.status === 401) {
    document.getElementById("login").showModal();
    throw new Error("Sign in first.");
  }
  const data = await response.json();
  if (!response.ok) throw new Error(data.error ?? "That did not work.");
  return data;
}

const money = (usd) => `$${(usd ?? 0).toFixed(2)}`;
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "");
const day = (iso) => (iso ? new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" }) : "");
function ago(iso) {
  if (!iso) return "";
  const minutes = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (minutes < 1) return "just now";
  if (minutes < 60) return `${minutes} min`;
  if (minutes < 1440) return `${Math.round(minutes / 60)} h`;
  return `${Math.round(minutes / 1440)} d`;
}
function span(start, end) {
  if (!start || !end) return "";
  const seconds = Math.round((Date.parse(end) - Date.parse(start)) / 1000);
  return seconds < 90 ? `${seconds} s` : `${Math.round(seconds / 60)} min`;
}

function track(ticket) {
  const line = el("div", { class: `track ${ticket.status}`, role: "img", "aria-label": `${WORDS[ticket.status]}, in ${PHASES[ticket.phase]}` });
  const finished = ticket.status === "merged" || ticket.status === "done";
  PHASES.forEach((_, index) => {
    if (index > 0) line.append(el("b", { class: index <= ticket.phase ? "done" : "" }));
    line.append(el("i", { class: finished || index < ticket.phase ? "done" : index === ticket.phase ? "done here" : "" }));
  });
  return line;
}

function phaseWord(ticket) {
  if (ticket.status === "merged" || ticket.status === "done" || ticket.status === "waiting") return WORDS[ticket.status];
  if (ticket.status === "review") return "Tested, ready to merge";
  if (ticket.status === "blocked") return `Blocked in ${PHASES[ticket.phase]}`;
  return ticket.status === "queued" ? "Planned, queued" : `${PHASES[ticket.phase]} in progress`;
}

function label(ticket) {
  return /^\d{13}-/.test(ticket.id) ? "new" : ticket.id;
}

function renderProjects() {
  const nav = document.getElementById("projects");
  const total = { runs: 0, usd: 0, week: 0 };
  const buttons = [el("button", { "aria-current": String(view.app === null), onclick: () => choose(null) }, "All projects")];
  for (const app of view.apps) {
    total.runs += app.today.runs; total.usd += app.today.usd; total.week += app.week.usd;
    const tally = Object.entries(app.tally).filter(([, n]) => n > 0).map(([status, n]) => `${n} ${WORDS[status].toLowerCase()}`).join(", ");
    buttons.push(el("button", { "aria-current": String(view.app === app.name), onclick: () => choose(app.name) }, app.name, el("span", { class: "tally" }, tally || "no tickets yet")));
  }
  buttons.push(el("button", { class: "new", onclick: openNew }, "New ticket"));
  nav.replaceChildren(...buttons);
  document.getElementById("spend").replaceChildren("Agent runs today ", el("strong", {}, `${total.runs}`), ` · ${money(total.usd)} · last 7 days ${money(total.week)} (API-equivalent)`);
  document.getElementById("clock").textContent = `updated ${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}`;
}

function renderNow() {
  const box = document.getElementById("now");
  const busy = view.apps.filter((app) => app.now);
  if (busy.length === 0) {
    const last = view.apps.map((app) => app.lastLine).filter(Boolean).sort((a, b) => b.at.localeCompare(a.at))[0];
    box.replaceChildren(el("p", { class: "idle" }, view.apps.length === 0 ? "No project has run yet. Run the orchestrator once for a project and it appears here." : `Nothing is running. Last activity ${ago(last?.at)} ago.`));
    return;
  }
  box.replaceChildren(...busy.map((app) => el("div", { class: "now" },
    el("div", { class: "step" }, el("span", { class: "pulse" }), `${app.now.phase}: ${app.now.title}`),
    el("div", {}, el("span", { class: "id" }, app.now.ticket), ` in ${app.name}, running for ${ago(app.now.since)}. ${app.now.step}`),
    app.now.action ? el("div", { class: "muted" }, `Last action ${ago(app.now.action.at)} ago: ${app.now.action.tool} ${app.now.action.text}`, app.now.action.subagents ? `, ${app.now.action.subagents} helper agent(s) at work` : "") : null,
    el("button", { class: "close", style: "float:none;margin-top:.5rem", onclick: () => openTicket(app.name, app.now.ticket) }, "Open ticket"),
  )));
}

function renderRows() {
  const rows = document.getElementById("rows");
  document.getElementById("list-title").textContent = view.app ? `Tickets in ${view.app}` : "Tickets in all projects";
  const order = { building: 0, blocked: 1, review: 2, waiting: 3, queued: 4, merged: 5, done: 6 };
  const list = [...view.tickets].sort((a, b) => order[a.status] - order[b.status] || String(b.updatedAt ?? "").localeCompare(String(a.updatedAt ?? "")));
  if (list.length === 0) {
    rows.replaceChildren(el("p", { class: "idle", style: "padding:1rem" }, "No tickets yet. Queue the first one with New ticket."));
    return;
  }
  rows.replaceChildren(...list.map((ticket) => el("button", { class: "row", onclick: () => openTicket(ticket.app, ticket.id) },
    el("div", { style: "min-width:0" }, el("div", { class: "title" }, el("span", { class: "id key" }, label(ticket)), ticket.title), view.app ? null : el("div", { class: "muted small" }, ticket.app)),
    el("div", {}, track(ticket), el("div", { class: `word ${ticket.status}` }, phaseWord(ticket), ticket.status === "blocked" && ticket.reason ? `: ${ticket.reason.slice(0, 50)}` : "")),
    el("div", { class: "meta" }, ticket.cost ? money(ticket.cost) : "", el("div", {}, ticket.updatedAt ? `${day(ticket.updatedAt)} ${clock(ticket.updatedAt)}` : "")),
  )));
}

function agentCard(run) {
  const act = run.activity;
  const rows = [];
  const add = (label, value) => { if (value && (!Array.isArray(value) || value.length)) rows.push(el("dt", {}, label), el("dd", {}, value)); };
  if (act) {
    add("Skills", act.skills.map((skill) => el("span", { class: "chip" }, skill)));
    add("Models", act.models.join(", "));
    add("Tools", Object.entries(act.tools).map(([tool, n]) => `${tool} ${n}`).join(" · "));
    add("Files", act.files.length ? act.files.join(", ") : undefined);
  }
  const helpers = act?.subagents?.length ? el("div", {}, el("div", { class: "muted", style: "margin-top:.6rem" }, `Helper agents it started: ${act.subagents.length}`), el("ul", { class: "helpers" }, act.subagents.map((agent) => el("li", {},
    el("strong", {}, agent.description || agent.kind), ` — ${agent.models.join(", ") || agent.askedModel || "same model"}`,
    agent.endedAt ? `, ${span(agent.startedAt, agent.endedAt)}` : "",
    Object.keys(agent.tools).length ? el("div", { class: "muted" }, Object.entries(agent.tools).map(([tool, n]) => `${tool} ${n}`).join(" · "), agent.files.length ? ` · wrote ${agent.files.length} file(s)` : "") : null,
  )))) : null;
  return el("div", { class: "agent" },
    el("div", { class: "who" }, el("strong", {}, run.role === "builder" ? "Builder" : "Verifier"), el("span", {}, `attempt ${run.attempt}`), el("span", { class: "muted" }, `${run.model} · ${run.wallMs ? `${Math.round(run.wallMs / 60000) || 1} min` : ""} · ${money(run.costUsd)} · ${clock(run.at)}`), run.verdict ? el("span", { class: "chip" }, run.verdict) : null, run.ok === false ? el("span", { class: "chip", style: "border-color:var(--stop);color:var(--stop)" }, "failed") : null),
    rows.length ? el("dl", {}, rows) : el("p", { class: "muted" }, "No detailed record of this run was found on this machine."),
    helpers,
    act?.commands?.length ? el("details", {}, el("summary", {}, `Commands it ran (${act.commands.length})`), el("pre", {}, act.commands.map((command) => `${clock(command.at)}  ${command.text}`).join("\n"))) : null,
    run.report ? el("details", {}, el("summary", {}, run.role === "builder" ? "Its report" : "Its verdict, in full"), el("pre", {}, run.report)) : null,
  );
}

async function openTicket(app, id) {
  view.open = { app, id };
  const sheet = document.getElementById("sheet");
  sheet.classList.add("open");
  try {
    const ticket = await call(`/api/apps/${encodeURIComponent(app)}/tickets/${encodeURIComponent(id)}`);
    if (view.open?.id !== id) return;
    const p = ticket.phases;
    const state = (index) => (ticket.status === "merged" || ticket.status === "done" || index < ticket.phase ? "done" : index === ticket.phase ? (ticket.status === "blocked" ? "stopped" : ticket.status === "building" ? "now" : "next") : "later");
    const section = (index, ...body) => el("section", { class: `phase ${state(index)}` },
      el("h3", {}, el("span", { class: "n" }, String(index + 1)), PHASES[index], el("span", { class: "state" }, { done: "done", now: "in progress", stopped: "stopped here", next: "next", later: "" }[state(index)])),
      ticket.skills[PHASES[index]]?.length ? el("p", { class: "used" }, "pstack used here: ", ticket.skills[PHASES[index]].map((skill) => el("span", { class: "chip" }, skill))) : null,
      body);
    const file = (name, text, open) => (text ? el("details", { open }, el("summary", {}, name), el("pre", {}, text)) : null);
    sheet.replaceChildren(...[
      el("button", { class: "close", onclick: closeTicket }, "Close"),
      el("div", { class: "id muted" }, `${app} / ${label(ticket)}`),
      el("h2", {}, ticket.title),
      el("div", { class: `word ${ticket.status}`, style: "margin:.3rem 0 .7rem" }, phaseWord(ticket), ticket.verdict ? ` (${ticket.verdict})` : "", ticket.attempts ? ` · ${ticket.attempts} attempt(s) · ${money(ticket.cost)}` : ""),
      track(ticket),
      el("div", { class: "stations" }, PHASES.map((name) => el("span", {}, name))),
      ticket.status === "blocked" ? el("div", { class: "why" }, el("strong", {}, `Why it stopped in ${PHASES[ticket.phase]}`), el("pre", {}, ticket.reason ?? "No reason recorded."), el("button", { onclick: () => retryTicket(app, id) }, "Put it back in the queue")) : null,
      section(0,
        el("p", { class: "muted" }, `Asked for by: ${p.Plan.origin}.`, ticket.status === "waiting" ? " The orchestrator gives it a number and starts at its next run." : ""),
        file("ticket.md", p.Plan.text, true)),
      p.Design ? section(1, p.Design.note ? file("design.md", p.Design.note, ticket.phase <= 2) : el("p", { class: "muted" }, ticket.phase > 1 ? "No design note was saved for this ticket (it was built before notes were required)." : "The builder writes its design note here before it changes any code.")) : null,
      p.Build ? section(2,
        p.Build.runs.map(agentCard),
        file("report.md", p.Build.note, false),
        p.Build.changed.length ? file("Files changed", p.Build.changed.join("\n"), false) : null,
        p.Build.runs.length === 0 && !p.Build.note ? el("p", { class: "muted" }, "Nothing built yet.") : null) : null,
      p.Test ? section(3,
        file("gates.txt", p.Test.gates, false),
        file("browser.txt", p.Test.browser, false),
        p.Test.runs.map(agentCard),
        file("verdict.md", p.Test.verdict, ticket.phase === 4),
        !p.Test.gates && !p.Test.verdict && p.Test.runs.length === 0 ? el("p", { class: "muted" }, "Gates, the browser check and the second agent's verdict land here.") : null) : null,
      p.Deploy ? section(4,
        p.Deploy.merged ? el("p", {}, `Merged ${day(p.Deploy.merged.at)} ${clock(p.Deploy.merged.at)} as `, el("span", { class: "id" }, p.Deploy.merged.commit), `. ${p.Deploy.merged.subject}`) : p.Deploy.ready ? el("p", {}, "Waiting for you: read the verdict, then merge ", el("span", { class: "id" }, p.Deploy.branch), " and push.") : el("p", { class: "muted" }, "Not reached yet."),
        el("p", { class: "muted" }, "Merging, pushing and restarting the app are done by you. GitHub Actions reruns the gates after the push.")) : null,
      p.Maintain ? section(5,
        p.Maintain.sensors.length ? el("ol", { class: "timeline" }, p.Maintain.sensors.map((event) => el("li", {}, el("time", {}, `${day(event.at)} ${clock(event.at)}`), el("span", {}, event.text)))) : el("p", { class: "muted" }, ticket.status === "merged" ? "No sensor has reported on this project since the merge." : "After the merge, the live check, the error tracker and the uptime check watch the running app.")) : null,
      ticket.timeline.length ? [el("h3", { class: "plain" }, "Every step, in order"), el("ol", { class: "timeline" }, ticket.timeline.map((event) => el("li", {}, el("time", {}, `${day(event.at)} ${clock(event.at)}`), el("span", {}, event.text))))] : null,
    ].flat(Infinity).filter(Boolean));
  } catch (error) {
    sheet.replaceChildren(el("button", { class: "close", onclick: closeTicket }, "Close"), el("p", { class: "error" }, error.message));
  }
}

function closeTicket() {
  view.open = null;
  document.getElementById("sheet").classList.remove("open");
}

async function retryTicket(app, id) {
  try {
    await call(`/api/apps/${encodeURIComponent(app)}/tickets/${encodeURIComponent(id)}/retry`, {});
    closeTicket();
    await refresh();
  } catch (error) {
    alert(error.message);
  }
}

function openNew() {
  const select = document.getElementById("new-app");
  select.replaceChildren(...view.apps.map((app) => el("option", { value: app.name, selected: app.name === view.app }, app.name)));
  document.getElementById("new-error").textContent = view.apps.length ? "" : "No project yet. Run the orchestrator once for a project first.";
  document.getElementById("new").showModal();
}

function choose(app) {
  view.app = app;
  refresh();
}

async function refresh() {
  try {
    view.apps = await call("/api/overview");
    const wanted = view.app ? view.apps.filter((app) => app.name === view.app) : view.apps;
    const lists = await Promise.all(wanted.map(async (app) => (await call(`/api/apps/${encodeURIComponent(app.name)}/tickets`)).map((ticket) => ({ ...ticket, app: app.name }))));
    view.tickets = lists.flat();
    renderProjects(); renderNow(); renderRows();
    if (view.open && view.tickets.some((ticket) => ticket.id === view.open.id && ticket.status === "building")) openTicket(view.open.app, view.open.id);
  } catch (error) {
    document.getElementById("clock").textContent = error.message;
  }
}

document.getElementById("new-cancel").addEventListener("click", () => document.getElementById("new").close());
document.getElementById("new-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  try {
    await call(`/api/apps/${encodeURIComponent(data.app)}/tickets`, data);
    event.target.reset();
    document.getElementById("new").close();
    await refresh();
  } catch (error) {
    document.getElementById("new-error").textContent = error.message;
  }
});
document.getElementById("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const response = await fetch("/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(event.target))) });
  if (response.ok) { document.getElementById("login").close(); refresh(); }
  else document.getElementById("login-error").textContent = (await response.json()).error;
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeTicket(); });

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
